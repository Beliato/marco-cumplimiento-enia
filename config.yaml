# =============================================================================
# Configuración central del marco operativo de cumplimiento regulatorio.
#
# REGLA DE ORO (reproducibilidad y no p-hacking):
#   El protocolo de equidad (bloque `equidad`: métricas, umbrales y soporte
#   mínimo) se declara AQUÍ, ANTES de ejecutar el pipeline. NUNCA se ajusta
#   después de observar los resultados. Todo cambio debe quedar en el
#   historial de git con su justificación.
#
# Este archivo es la ÚNICA fuente de verdad para parámetros. El código no debe
# contener constantes ocultas ni valores por defecto que sustituyan a los de
# aquí: si una clave falta, el cargador debe fallar de forma explícita.
# =============================================================================

version_marco: "0.1.0"

# --- Sistema evaluado --------------------------------------------------------
# Describe el sistema auditado, no el marco. El código no interpreta nada de
# esto: lo copia tal cual a la ficha de caracterización del paso 1 (Tabla 9).
# Auditar otro sistema = reescribir este bloque.
sistema:
  nombre: >-
    Clasificador de actividades de la vida diaria a partir de sensores PIR
    (caso de estudio del marco operativo de cumplimiento de la ENIA)
  finalidad: >-
    Inferir qué actividad de la vida diaria realiza una persona adulta mayor
    que vive sola, a partir de eventos de sensores ambientales pasivos, para
    que un servicio de monitoreo domiciliario pueda acompañar su permanencia
    segura y autónoma en el hogar. El sistema no diagnostica ni decide
    intervenciones clínicas.
  poblacion_destinataria: >-
    Personas adultas mayores que viven de forma independiente en su hogar, y
    las personas cuidadoras que reciben la información. La edad es la
    condición que define a la población, así que el sistema opera sobre una
    diferencia protegida: la ENIA reconoce a las personas adultas mayores
    como grupo prioritario (MICITT, 2024), y el AI Act EU agrava las
    exigencias cuando un sistema se dirige a un grupo vulnerable por su edad.
  tarea_aprendizaje: >-
    Clasificación multiclase de ventanas de eventos de sensores en
    actividades de la vida diaria, sobre datos tabulares.
  contexto_sensores: >-
    Sensores de infrarrojo pasivo en el techo, sensores magnéticos de puerta y
    sensores de temperatura. No hay cámara ni micrófono: la literatura del
    dominio documenta esta configuración como la menos intrusiva para
    entornos domiciliarios (Kim et al., 2022).
  contexto_despliegue: >-
    Piloto de investigación sobre datos públicos ya recolectados. No hay
    despliegue en viviendas reales ni personas participantes: los resultados
    documentan la aplicabilidad técnica del marco, no la pertinencia clínica
    del modelo.
  personas_afectadas: >-
    La persona monitoreada y quienes la cuidan. En un despliegue real, ambas
    deben poder pedir la explicación de una inferencia concreta —el marco la
    produce por evento— y objetarla ante la organización declarada como
    responsable en la bitácora. En este piloto esa vía no existe porque no hay
    personas monitoreadas: los datos son públicos e históricos.
  delimitacion: >-
    El objeto de evaluación es el marco operativo y su capacidad de generar
    evidencia verificable; el modelo actúa como sujeto de prueba, no como
    objeto de optimización (Tabla 10). Quedan fuera de alcance la pertinencia
    clínica de las predicciones y la generalización del instrumento a todo
    contexto de despliegue.

# --- Reproducibilidad ---------------------------------------------------------
semilla: 42
determinismo:
  # PYTHONHASHSEED debe fijarse como variable de entorno ANTES de arrancar el
  # intérprete (scripts/setup.sh y el Makefile lo exportan). Se repite aquí
  # solo para que quede declarado y verificable.
  pythonhashseed: 42
  # 1 => ejecución de un solo hilo. Evita el no-determinismo introducido por
  # el paralelismo de scikit-learn / BLAS.
  n_jobs: 1

# --- Rutas (relativas a la raíz del repositorio) ----------------------------
rutas:
  datos_crudos: datos/crudos
  datos_intermedios: datos/intermedios
  artefactos: artefactos
  plantillas: plantillas
  registro_inferencias: artefactos/bitacora/inferencias.jsonl
  manifiesto: artefactos/manifiesto.json
  # Productos de los pasos 1 y 3 del procedimiento (Tabla 9).
  ficha_caracterizacion: artefactos/ficha_caracterizacion.md
  protocolo_evaluacion: artefactos/protocolo_evaluacion.md
  datasheet: artefactos/datasheet.md
  model_card: artefactos/model_card.md
  reporte_explicabilidad: artefactos/reporte_explicabilidad.md
  reporte_equidad: artefactos/reporte_equidad.md
  reporte_cumplimiento: artefactos/reporte_cumplimiento.md
  # Qué paso corrió, cuándo y con qué entradas y salidas (paso 6).
  bitacora_ejecucion: artefactos/bitacora_ejecucion.md

# --- Dataset ----------------------------------------------------------------
datos:
  fuente: >-
    CASAS Aruba (WSU CASAS smart home project). Residente única: una persona
    adulta mayor que vive en la comunidad, según la tabla de viviendas del
    depósito oficial de CASAS (DOI 10.5281/zenodo.15708568); la documentación
    original de Aruba la describe como mujer adulta voluntaria. Hijos y nietos
    la visitan con regularidad. 2010-11-04 a 2011-06-11. Citar: D. Cook, "Learning setting-generalized activity models
    for smart spaces", IEEE Intelligent Systems, 2011. Licencia y procedencia
    de la copia usada: ver `datos.documentacion.licencia`.
  archivo_crudo: datos/crudos/aruba.txt
  # Formato del crudo. Selecciona el lector de `src/comun/lectores.py`, que
  # es lo único del marco que conoce un formato concreto. Aplicar el marco a
  # otro dataset PIR = escribir un lector nuevo y cambiar esta clave; ningún
  # otro módulo se entera. Ver docs/aplicar-a-otro-dataset.md
  formato: casas_eventos
  # Columna objetivo del cuadro de características que produce `datos.py`.
  columna_objetivo: actividad

  # Sensores presentes en el crudo, por tipo.
  columnas_sensor_pir: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022, M023, M024, M025, M026, M027, M028, M029, M030, M031]
  sensores_puerta: [D001, D002, D004]
  sensores_temperatura: [T001, T002, T003, T004, T005]

  # Mapeo sensor -> zona del hogar. Derivado por correspondencia temporal con
  # el release consolidado oficial de CASAS, que generaliza los sensores a
  # nombres de habitación: 1.596.509 eventos coincidentes, 100 % de acuerdo y
  # cero ambigüedad. Da nombres legibles por un cuidador, que es lo que exige
  # el R3.3; "M009" no significa nada para un destinatario no técnico.
  zonas:
    D001: OutsideDoor
    D002: OutsideDoor
    D004: OutsideDoor
    M001: Bedroom
    M002: Bedroom
    M003: Bedroom
    M004: Bathroom
    M005: Bedroom
    M006: Bedroom
    M007: Bedroom
    M008: OtherRoom
    M009: LoungeChair
    M010: LoungeChair
    M011: OutsideDoor
    M012: LivingRoom
    M013: LivingRoom
    M014: DiningRoom
    M015: Kitchen
    M016: Kitchen
    M017: Kitchen
    M018: Kitchen
    M019: Kitchen
    M020: LivingRoom
    M021: GuestRoom
    M022: GuestRoom
    M023: GuestRoom
    M024: Bathroom
    M025: WorkArea
    M026: WorkArea
    M027: WorkArea
    M028: WorkArea
    M029: Bathroom
    M030: OutsideDoor
    M031: OtherRoom

  # Nombre de cada zona en el idioma de las personas destinatarias. La ENIA
  # exige sistemas cultural y lingüísticamente apropiados (p. 32), y el R3.3
  # exige información comprensible: "LoungeChair" no lo es para una cuidadora
  # hispanohablante. Solo cambia lo que se muestra; los datos, las columnas y
  # los nombres técnicos siguen igual (D54).
  nombres_zona:
    Bathroom: el baño
    Bedroom: el dormitorio
    DiningRoom: el comedor
    Kitchen: la cocina
    LivingRoom: la sala
    LoungeChair: el sillón
    OutsideDoor: la puerta de salida
    WorkArea: el área de trabajo
    GuestRoom: la habitación de huéspedes
    OtherRoom: otra habitación
  actividades:
    # Los eventos fuera de todo span anotado (53,5 % del crudo) forman su
    # propia clase en vez de descartarse: son el comportamiento real del hogar
    # y omitirlos sesgaría el modelo hacia un día idealizado.
    etiqueta_sin_actividad: Otro
    # `Respirate` tiene 6 instancias en todo el dataset. Con seis ejemplos no
    # se puede partir ni evaluar de forma sensata.
    excluidas: [Respirate]
    # Agrupa variantes de un mismo quehacer. Aruba ya trae las etiquetas
    # agrupadas, así que acá está vacío.
    mapeo: {}

  # Documentación del dataset para el datasheet del paso 2 (Gebru et al.,
  # 2021). Es propia del dataset, no del marco: el código la copia tal cual.
  documentacion:
    creador: >-
      WSU CASAS smart home project, Center for Advanced Studies in Adaptive
      Systems, Washington State University — http://casas.wsu.edu/
    motivacion: >-
      Construir un recurso longitudinal de comportamiento naturalista en el
      hogar, para investigación en reconocimiento de actividades de la vida
      diaria con sensores ambientales.
    mecanismo_recoleccion: >-
      Sensores instalados en la vivienda, registrando de forma continua
      mientras la residente hacía su vida normal. Las actividades las anotó
      un anotador externo.
    consentimiento: >-
      La recolección la realizó CASAS con residentes voluntarios, bajo su
      propio protocolo de investigación. Este proyecto no recolectó datos ni
      tuvo contacto con personas participantes.
    datos_personales: >-
      No hay identificadores directos, pero los datos describen la rutina
      doméstica de una persona identificable por su patrón de vida. Se tratan
      como sensibles: el crudo nunca se versiona y la bitácora guarda un hash
      de la ventana de entrada, no los eventos.
    uso_en_proyecto: >-
      Entrenamiento y evaluación del modelo de referencia que el marco audita.
      Su desempeño no se optimiza.
    usos_no_recomendados: >-
      No usar para inferir estado de salud, capacidad funcional o riesgo
      clínico de una persona, ni para vigilancia. Una sola vivienda y una sola
      residente no sostienen conclusiones sobre poblaciones.
    licencia: >-
      El depósito de CASAS en Zenodo (2025) publica estos hogares bajo CC BY
      4.0, DOI 10.5281/zenodo.15708568. La copia usada aquí proviene de la
      distribución anterior, cuyo README pedía no redistribuir sin permiso
      expreso de CASAS; por eso el crudo se mantiene fuera del repositorio.
    instrucciones_descarga: >-
      La copia anotada no está en el depósito oficial
      (https://zenodo.org/records/15708568): ahí Aruba se publica sin
      etiquetas de actividad, y `labeled_data.zip` trae otras series. La copia
      usada proviene de la distribución anterior de CASAS, obtenida de un
      repositorio de terceros, y su procedencia se verificó contra el release
      oficial. Colocar el crudo en `datos/crudos/` con el nombre declarado en
      `datos.archivo_crudo`, y no versionarlo nunca.

  # Cortes que definen el subgrupo de equidad `franja_horaria`. Es una
  # decisión de dominio, no una constante: un servicio con turnos de noche
  # distintos querría otros cortes, y ese cambio no debe exigir tocar código.
  # `desde` es la hora de inicio inclusive; la primera franja debe empezar
  # en 0 y los cortes deben ser ascendentes.
  # Los nombres tienen que coincidir con `equidad.subgrupos[franja_horaria]`.
  franjas_horarias:
    - {desde: 0,  nombre: madrugada}
    - {desde: 6,  nombre: mañana}
    - {desde: 12, nombre: tarde}
    - {desde: 18, nombre: noche}

  ventana:
    # Nº de eventos consecutivos que forman una ventana de observación.
    # Ventanas disjuntas: no se solapan, para que no haya fuga entre filas.
    n_eventos: 30

  particion:
    # Partición TEMPORAL por día, no aleatoria. Los eventos están ordenados en
    # el tiempo y son fuertemente autocorrelacionados: una partición aleatoria
    # deja eventos contiguos del mismo segmento de actividad a ambos lados y
    # produce una exactitud optimista. Sobre una exactitud inflada se calculan
    # después la explicabilidad y la equidad, así que la fuga contaminaría el
    # expediente entero.
    estrategia: temporal_por_dia
    test_size: 0.2

# --- Modelo ----------------------------------------------------------------
modelo:
  tipo: RandomForestClassifier
  # Versión semántica del modelo. Se sella en cada ejecución y se registra en
  # cada inferencia de la bitácora.
  version: "0.1.0"
  hiperparametros:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    class_weight: balanced
    random_state: 42
    n_jobs: 1

# --- Principio 1: Explicabilidad ------------------------------------------
explicabilidad:
  explainer: TreeExplainer
  # Cómo simula SHAP la ausencia de una característica. `tree_path_dependent`
  # sigue la cobertura de los propios árboles: no pide datos de fondo, es
  # determinista y sobre el modelo de referencia cuesta ~95 ms por inferencia
  # (~18 min para toda la prueba de Aruba). `interventional` cuesta unas 8
  # veces más con un fondo de 100 filas y obliga a justificar ese fondo; el
  # cargador lo acepta pero todavía no está implementado. Ambos los define
  # Lundberg et al. (2020), ya citado en el §5.8 del documento.
  perturbacion: tree_path_dependent
  # true => toda inferencia de prueba se explica y la bitácora la referencia
  # (R3.1, Tabla 8). El documento exige explicar "toda predicción relevante"
  # sin definir "relevante"; en el piloto se consideran relevantes TODAS las
  # inferencias de prueba, porque el criterio de éxito es reconstruir el
  # comportamiento completo del sistema.
  guardar_local_por_inferencia: true
  # Puntos (muestra determinista con la semilla) que se dibujan en cada
  # gráfico de dependencia. NO afecta la importancia global: esa agrega TODAS
  # las explicaciones locales del conjunto de evaluación (Tabla 6, R3.2).
  muestras_graficos: 1000
  # Características que se destacan en los enunciados en lenguaje llano
  # (R3.3) y que reciben gráfico de dependencia.
  caracteristicas_destacadas: 3
  # Ejemplos locales del reporte: N aciertos y N errores, selección
  # determinista con la semilla.
  ejemplos_por_tipo: 3

# --- Principio 2: Equidad -------------------------------------------------
equidad:
  # Subgrupos de comparación. Cada entrada referencia una columna presente
  # tras la preparación de datos y dice por qué se compara: la justificación
  # va tal cual al reporte de equidad y al protocolo del paso 3.
  subgrupos:
    - nombre: franja_horaria
      columna: franja_horaria
      categorias: [madrugada, mañana, tarde, noche]
      justificacion: >-
        Las actividades de la residente cambian a lo largo del día. Comparar
        por franja comprueba que el sistema no deje sin cobertura las
        actividades propias de una parte del día.
    - nombre: tipo_dia
      columna: tipo_dia
      categorias: [laborable, fin_de_semana]
      justificacion: >-
        Los hijos y nietos de la residente la visitaban con regularidad, así
        que el fin de semana concentra eventos de sensor que no son suyos. Un
        sistema que degrada con visitas es un problema real de un servicio de
        monitoreo domiciliario, no una curiosidad estadística.
  # Limitaciones que el reporte de equidad declara tal cual. Son propias del
  # dataset, no del marco: por eso viven aquí y no en el código.
  limitaciones:
    - >-
      Aruba tiene una sola residente, así que no existen subgrupos
      poblacionales: los dos subgrupos evaluados son contextuales. Miden si el
      sistema funciona igual de bien en distintas condiciones, no si
      discrimina entre personas, y satisfacen el R4.1 solo en parte. La brecha
      se cierra en el segundo piloto (`config.hogares.yaml`), que corre sobre
      nueve viviendas de la serie hh del depósito oficial de CASAS y compara
      personas. Los demás hogares de ese depósito se publican sin etiquetas de
      actividad, así que no sirven para clasificación supervisada.
    - >-
      La franja horaria se deriva de la hora, que es además una variable de
      entrada del modelo: parte de la disparidad entre franjas es por diseño,
      no un sesgo emergente.
    - >-
      Las actividades con pocos casos en la prueba pueden quedar no
      evaluables. Entre ellas está Bed_to_Toilet, los traslados nocturnos al
      baño: este dataset no permite comprobar si se reconocen igual de bien en
      cada categoría, solo si sus falsas alarmas se reparten por igual.
  # --- Protocolo de medición (R4.2) ---------------------------------------
  # Todo lo que sigue se fija ANTES de calcular ninguna métrica (D8) y el
  # paso 3 lo sella por hash (D13). Justificación en D42-D44.
  #
  # Multiclase: cada actividad se evalúa contra el resto. Una tasa se calcula
  # solo si su denominador en la categoría llega a `soporte_minimo` casos:
  # las ventanas de la actividad real para la tasa de verdaderos positivos,
  # las del resto para la de falsos positivos. Las categorías por debajo
  # quedan fuera de la comparación y el reporte las nombra. Si quedan menos
  # de dos, la combinación es "no evaluable": ni se descarta en silencio ni
  # cuenta como aprobada.
  soporte_minimo: 30
  # Métricas que DECIDEN el veredicto, con su umbral. Ambas condicionan en la
  # actividad real, así que no castigan que la residente duerma de madrugada
  # y no a la tarde; juntas equivalen a probabilidades igualadas (equalized
  # odds). Aprueba si y solo si toda combinación evaluable (subgrupo x
  # actividad x métrica) respeta su umbral; sin ninguna evaluable, el
  # veredicto es "no evaluable", nunca "aprueba".
  umbrales:
    true_positive_rate_difference: 0.10   # igualdad de oportunidades
    false_positive_rate_difference: 0.10
  # Métricas que se calculan y REPORTAN, pero no deciden. La paridad
  # demográfica exige que cada actividad se prediga con la misma frecuencia
  # en todas las categorías, y con franjas horarias falla por construcción:
  # en las etiquetas reales de prueba, Sleeping es el 23,1 % de las ventanas
  # de madrugada y el 0,2 % de las de tarde, así que un modelo perfecto
  # tendría una diferencia de 0,23. Se conservan porque la tesis las nombra.
  descriptivas:
    - demographic_parity_difference
    - selection_rate_ratio              # "regla del 80 %"
  # Justificación de los umbrales, que el protocolo del paso 3 declara tal
  # cual. La tesis (Capítulo 6) deja la calibración definitiva a un panel de
  # especialistas: mientras tanto, el criterio se declara y se somete a
  # revisión, que es lo que exige el R4.2.
  justificacion_umbrales: >-
    No existe un umbral normativo para diferencias absolutas de tasas en este
    dominio. Se adopta 0,10 —diez puntos porcentuales— como criterio propio
    para señalar una disparidad relevante entre categorías: por debajo de ese
    margen, la diferencia queda dentro de lo que el tamaño de los subgrupos
    de este conjunto de evaluación permite distinguir del azar. La regla del
    80 %, que sí tiene origen normativo en la selección de personal, se
    reporta como descriptiva porque presupone un resultado favorable que en
    la clasificación de actividades no existe. Ambos criterios quedan
    sujetos a la validación por un panel multidisciplinario prevista en el
    Capítulo 6.

# --- Principio 3: Trazabilidad ------------------------------------------
trazabilidad:
  version_esquema: "1.0.0"
  formato: jsonl
  # Responsable declarado por defecto para las inferencias (persona + rol).
  responsable_por_defecto: >-
    Méndez Arias Miguel Ángel y Segura Miranda Laura María — Investigadores
    responsables, Universidad CENFOTEC

# --- Articulación normativa ---------------------------------------------------
# Mapeo (provisional, validar con especialista legal) de cada principio de la
# Estrategia Nacional de IA de Costa Rica con AI Act EU y NIST AI RMF.
# Los nombres de los principios son los que usa la ENIA, no paráfrasis: el
# quinto se llama "Responsabilidad", y la rendición de cuentas y la
# trazabilidad son contenidos suyos, no su nombre (D53).
articulacion_normativa:
  explicabilidad:
    enia_cr: "Principio rector 3 — Transparencia y explicabilidad (ENIA, p. 32)"
    ai_act_eu: "Art. 13 — Transparencia y comunicación de información"
    nist_ai_rmf: "MEASURE 2.9 / Función EXPLAIN"
  equidad:
    enia_cr: "Principio rector 4 — Equidad y no discriminación (ENIA, pp. 32-33)"
    ai_act_eu: "Art. 10 — Gobernanza de datos y sesgos"
    nist_ai_rmf: "MEASURE 2.11 — Sesgo perjudicial"
  trazabilidad:
    enia_cr: "Principio rector 5 — Responsabilidad (ENIA, p. 33)"
    ai_act_eu: "Art. 12 — Conservación de registros (logging)"
    nist_ai_rmf: "GOVERN 1.4 / MANAGE 4.1"
